services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # NOTICE: Port 4000 host mapping is removed! 
    # LiteLLM is now strictly reachable internally via Nginx.
    networks:
      - llm-net
    depends_on:
      - ollama-server

  nginx-ingress:
    image: nginx:alpine
    container_name: nginx-ingress
    restart: unless-stopped
    volumes:
      # Mount Nginx reverse proxy configuration as read-only
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Standard HTTPS port for corporate/firewall compatibility
      - "443:443"
      # Legacy Ollama port for client backwards compatibility
      - "11434:11434"
    networks:
      - llm-net
    depends_on:
      - litellm-proxy

volumes:
  ollama_data:
    external: true

networks:
  llm-net:
    driver: bridge
