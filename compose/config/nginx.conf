# Unified Ingress Configuration: Serves Open WebUI (Frontend) & LiteLLM (API) on Port 443
events {
    worker_connections 1024;
}

http {
    # Rate limiting zone for API endpoints (15 req/s with burst buffer)
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=15r/s;

    # Allow large document uploads (e.g. PDFs / TXT for Open WebUI RAG indexing)
    client_max_body_size 50M;

    server {
        listen 443;
        listen 11434;

        # -------------------------------------------------------------
        # 1. API GATEWAY ROUTE: Routes OpenAI-compatible requests to LiteLLM
        # Used by VS Code (Continue.dev), Obsidian, and Aider
        # -------------------------------------------------------------
        location /v1/ {
            # Enforce rate limit zone to protect GPU from runaway loops
            limit_req zone=ai_limit burst=30 nodelay;

            proxy_pass http://litellm-proxy:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time SSE token streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;

            # Extended timeouts for DeepSeek-R1 reasoning chains
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # -------------------------------------------------------------
        # 2. FRONTEND WEB CHAT ROUTE: Routes browser traffic to Open WebUI
        # -------------------------------------------------------------
        location / {
            proxy_pass http://open-webui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for Open WebUI WebSocket connections (live chat status)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard streaming and buffering defaults for WebUI
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
