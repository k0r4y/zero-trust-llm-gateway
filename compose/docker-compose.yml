services:
  ollama-server:
    image: ollama/ollama:0.3.13
    container_name: ollama-server
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 24G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.44.7
    container_name: litellm-proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - llm-net
    depends_on:
      - ollama-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.3.15
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_MODELS=deepseek-r1:7b
    networks:
      - llm-net
    depends_on:
      - litellm-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-ingress:
    image: nginx:1.27.1-alpine
    container_name: nginx-ingress
    restart: unless-stopped
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "11434:11434"
    networks:
      - llm-net
    depends_on:
      - open-webui
      - litellm-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:
  open-webui_data:

networks:
  llm-net:
    driver: bridge
