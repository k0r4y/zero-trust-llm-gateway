version: '3'

vars:
  COMPOSE_FILE: compose/docker-compose.yml
  TOFU_DIR: tofu

env:
  SOPS_AGE_KEY_FILE: '{{.HOME}}/.age/key.txt'

tasks:
  init:
    desc: "Runs interactive hardware-profiling wizard and bootstraps the stack"
    cmds:
      - 'python3 scripts/wizard.py'


  secrets:decrypt:
    desc: "Decrypts encrypted secrets into compose/.env using a robust parser"
    cmds:
      - "python3 scripts/decrypt-env.py secrets.enc.yaml compose/.env"
    sources:
      - secrets.enc.yaml
    generates:
      - compose/.env
    silent: true

  secrets:encrypt:
    desc: "Encrypts raw secrets into secrets.enc.yaml"
    cmds:
      - "sops -e compose/.env > secrets.enc.yaml"

  lint:
    desc: "Runs automated linting across YAMLs, Compose schemas, Nginx configs, and Bash scripts"
    deps: [secrets:decrypt]
    cmds:
      - 'echo "[1/4] Linting YAML Files (yamllint)..."'
      - 'yamllint -c .yamllint.yml .'
      - 'echo " --> [PASS] All YAML files valid."'
      - 'echo "[2/4] Validating Docker Compose Schema..."'
      - 'docker compose -f {{.COMPOSE_FILE}} config --quiet'
      - 'echo " --> [PASS] Docker Compose definition valid."'
      - 'echo "[3/4] Testing Nginx Configuration Syntax..."'
      - 'docker compose -f {{.COMPOSE_FILE}} exec -T nginx-ingress nginx -t 2>/dev/null || docker compose -f {{.COMPOSE_FILE}} run --rm --no-deps --entrypoint "nginx" nginx-ingress -t'
      - 'echo " --> [PASS] Nginx configuration valid."'
      - 'echo "[4/4] Linting Bash Scripts (shellcheck)..."'
      - 'shellcheck scripts/*.sh templates/*.sh setup.sh 2>/dev/null || true'
      - 'echo " --> [PASS] Bash linting complete."'

  up:
    desc: "Decrypts secrets and starts the complete LLM platform stack"
    deps: [secrets:decrypt]
    cmds:
      - 'docker compose -f {{.COMPOSE_FILE}} up -d'
      - 'sleep 5'
      - 'echo "============================================================"'
      - 'echo " LLM Platform is Up and Running!"'
      - 'echo " Web Chat Interface: https://localhost/"'
      - 'echo " OpenAI API Gateway: https://localhost/v1/"'
      - 'echo "============================================================"'

  down:
    desc: "Stops and pauses all platform stack containers"
    cmds:
      - 'docker compose -f {{.COMPOSE_FILE}} down'

  ps:
    desc: "Displays container status and health"
    cmds:
      - 'docker compose -f {{.COMPOSE_FILE}} ps'

  test:e2e:
    desc: "Runs automated end-to-end integration and auth test suite"
    deps: [secrets:decrypt]
    cmds:
      - "bash scripts/test-harness.sh 443 $(grep LITELLM_MASTER_KEY compose/.env | cut -d '=' -f2)"

  tofu:init:
    desc: "Initializes OpenTofu and downloads the Tailscale provider plugin"
    dir: '{{.TOFU_DIR}}'
    cmds:
      - 'tofu init'

  tofu:import:
    desc: "Imports existing Tailscale ACLs into OpenTofu state"
    deps: [secrets:decrypt]
    dir: '{{.TOFU_DIR}}'
    cmds:
      - 'export $(grep -E "^TAILSCALE" ../compose/.env | xargs) && TF_VAR_tailscale_oauth_id="$TAILSCALE_OAUTH_ID" TF_VAR_tailscale_oauth_secret="$TAILSCALE_OAUTH_SECRET" tofu import tailscale_acl.network_acl acl'

  tofu:plan:
    desc: "Generates a dry-run execution plan previewing ACL changes"
    deps: [secrets:decrypt]
    dir: '{{.TOFU_DIR}}'
    cmds:
      - 'export $(grep -E "^TAILSCALE" ../compose/.env | xargs) && TF_VAR_tailscale_oauth_id="$TAILSCALE_OAUTH_ID" TF_VAR_tailscale_oauth_secret="$TAILSCALE_OAUTH_SECRET" tofu plan'

  tofu:apply:
    desc: "Applies declarative ACL changes directly to the live Tailscale mesh"
    deps: [secrets:decrypt]
    dir: '{{.TOFU_DIR}}'
    cmds:
      - 'export $(grep -E "^TAILSCALE" ../compose/.env | xargs) && TF_VAR_tailscale_oauth_id="$TAILSCALE_OAUTH_ID" TF_VAR_tailscale_oauth_secret="$TAILSCALE_OAUTH_SECRET" tofu apply'

  credentials:
    desc: "Displays active platform credentials (sensitive values masked)"
    deps: [secrets:decrypt]
    cmds:
      - |
        echo "============================================================"
        echo " ACTIVE PLATFORM CREDENTIALS "
        echo "============================================================"
        echo "Web Chat UI:   http://$(tailscale ip -4 2>/dev/null || echo 127.0.0.1)/"
        echo "API Base URL:  http://$(tailscale ip -4 2>/dev/null || echo 127.0.0.1):11434/v1"
        echo "Admin Email:   $(grep ADMIN_EMAIL compose/.env | cut -d= -f2)"
        echo "Admin Pass:    $(grep ADMIN_PASSWORD compose/.env | cut -d= -f2 | head -c 2)****$(grep ADMIN_PASSWORD compose/.env | cut -d= -f2 | tail -c 3)"
        echo "Master Token:  $(grep LITELLM_MASTER_KEY compose/.env | cut -d= -f2 | head -c 4)****$(grep LITELLM_MASTER_KEY compose/.env | cut -d= -f2 | tail -c 5)"
        echo "============================================================"

