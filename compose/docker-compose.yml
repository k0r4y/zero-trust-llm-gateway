services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - llm-net
    depends_on:
      - ollama-server

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      # Reuses existing named volume for chat history, user database, and settings
      - open-webui_data:/app/backend/data
    environment:
      # Points Open WebUI to LiteLLM as an OpenAI-compatible backend provider
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=true
    networks:
      - llm-net
    depends_on:
      - litellm-proxy

  nginx-ingress:
    image: nginx:alpine
    container_name: nginx-ingress
    restart: unless-stopped
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "443:443"
      - "11434:11434"
    networks:
      - llm-net
    depends_on:
      - open-webui
      - litellm-proxy

volumes:
  ollama_data:
    external: true
  open-webui_data:
    external: true

networks:
  llm-net:
    driver: bridge
