# Ingress Controller Configuration for LLM Streaming Gateway
events {
    # Maximum number of simultaneous network connections per worker process
    worker_connections 1024;
}

http {
    # RATE LIMITING ZONE:
    # Allocates 10MB of shared memory (holds ~160,000 client IP states).
    # Enforces a rate limit of 15 requests per second ($binary_remote_addr)
    # to protect the NVIDIA GPU from compute exhaustion / denial-of-service loops.
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=15r/s;

    server {
        # Listen on standard HTTPS port (443) and legacy Ollama port (11434)
        listen 443;
        listen 11434;

        # Apply rate limiting with a burst buffer of 30 requests.
        # 'nodelay' processes valid burst requests immediately without artificial latency.
        limit_req zone=ai_limit burst=30 nodelay;

        location / {
            # Route traffic internally across Docker bridge 'llm-net' to LiteLLM
            proxy_pass http://litellm-proxy:4000;

            # Forward original client headers so LiteLLM logs accurate client IP addresses
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL FOR REAL-TIME LLM TOKEN STREAMING (Server-Sent Events / SSE):
            # 1. proxy_buffering off: Prevents Nginx from holding tokens in memory;
            #    forwards each token chunk to the client the millisecond it is generated.
            proxy_buffering off;
            # 2. proxy_cache off: Disables caching for dynamic completions.
            proxy_cache off;
            # 3. HTTP 1.1 + empty Connection header: Keeps persistent connection open for streams.
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            # 4. chunked_transfer_encoding on: Sends partial HTTP chunks as stream progresses.
            chunked_transfer_encoding on;

            # EXTENDED TIMEOUTS FOR DEEP REASONING MODELS:
            # Prevents Nginx from cutting off DeepSeek-R1 mid-generation (default is 60s).
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }
    }
}
