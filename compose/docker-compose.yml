services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    environment:
      # Allows Ollama to process up to 2 concurrent inference streams simultaneously
      - OLLAMA_NUM_PARALLEL=2
      # Keeps up to 2 distinct models pinned in GPU VRAM (e.g. coding + embeddings)
      # to prevent aggressive model evictions and 10s reload latency spikes.
      - OLLAMA_MAX_LOADED_MODELS=2
      # Extends memory retention to 15m idle before unloading weights from VRAM
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      # Reuses the exact named volume where DeepSeek and Qwen are already stored
      - ollama_data:/root/.ollama
    networks:
      # Attached ONLY to internal bridge; no host port mapping exists here.
      # This prevents any direct bypass of the LiteLLM authentication layer.
      - llm-net
    deploy:
      resources:
        reservations:
          devices:
            # Passes the NVIDIA GPU from the Windows/WSL2 host into the container
            - driver: nvidia
              count: all
              capabilities: [gpu]

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    volumes:
      # Mounts the routing and model mapping file as read-only for security
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    environment:
      # Injected from compose/.env
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Bound to localhost (127.0.0.1) ONLY for Loop 1 verification.
      # (In Loop 2, this port will be closed from the host and placed behind Nginx).
      - "127.0.0.1:4000:4000"
    networks:
      - llm-net
    depends_on:
      - ollama-server

volumes:
  ollama_data:
    # CRITICAL: 'external: true' tells Docker Compose to use the pre-existing
    # volume named 'ollama_data' instead of prefixing it as 'compose_ollama_data',
    # preventing the redownload of ~15GB of model weights.
    external: true

networks:
  llm-net:
    # User-defined bridge network providing automatic internal container DNS resolution
    driver: bridge
